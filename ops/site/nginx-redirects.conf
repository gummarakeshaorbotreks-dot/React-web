# Old aorbotreks.com addresses -> their new address (301), so links and Google's index carry over.
# Installed at /etc/nginx/snippets/aorbo-redirects.conf; included in the aorbotreks.com server block.
# 19 Nov 2026: two trek ids had typos (website DB renamed in place, backup /root/aorboweb-before-slug-fix-*.dump).
location ~ ^/treks/darjelling/?$ { return 301 https://aorbotreks.com/treks/darjeeling; }
location ~ ^/treks/udaipur-chittorgrah/?$ { return 301 https://aorbotreks.com/treks/udaipur-chittorgarh; }
location ~ ^/data/treks/darjelling\.json$ { return 301 https://aorbotreks.com/data/treks/darjeeling.json; }
location ~ ^/data/treks/udaipur-chittorgrah\.json$ { return 301 https://aorbotreks.com/data/treks/udaipur-chittorgarh.json; }
