<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google shows the site's icon next to search results: it wants a square icon whose
         size is a multiple of 48px (192 here), and also tries /favicon.ico at the root. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96x96.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Trek and blog photos are served from Supabase storage: open the connection early -->
    <link rel="preconnect" href="https://xsconhhzyaiowokwsqne.supabase.co" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-->
    <title>Aorbo Treks | Book Verified Treks Across India</title>
    <meta name="description" content="Find and book treks across India from verified trek organisers. Compare Himalayan, Western Ghats and weekend treks by price, duration and reviews, and book in minutes." />
    <link rel="canonical" href="https://aorbotreks.com/" />
    <meta property="og:title" content="Aorbo Treks | Book Verified Treks Across India" />
    <meta property="og:description" content="Find and book treks across India from verified trek organisers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aorbotreks.com/" />
    <meta property="og:image" content="https://aorbotreks.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aorbo Treks | Book Verified Treks Across India" />
    <meta name="twitter:description" content="Find and book treks across India from verified trek organisers." />
    <!--/seo-->
  </head>
  <body>
    <script>
      // On the home page, start loading the treks now instead of waiting for
      // the app's JavaScript (it picks this up via window.__prefetch).
      if (location.pathname === '/' && !location.search) {
        var api = '%VITE_API_URL%';
        if (api.charAt(0) === '%') api = 'http://127.0.0.1:8000';
        window.__prefetch = {
          '/api/treks/?page=1': fetch(api + '/api/treks/?page=1').then(function (r) {
            return r.ok ? r.json() : Promise.reject(new Error('Request failed (' + r.status + ')'));
          }),
        };
        window.__prefetch['/api/treks/?page=1'].catch(function () {});
      }
    </script>
    <style>#main[data-prerendered]:empty { min-height: 100vh; }</style>
    <!-- Filled in at build time by scripts/prerender.mjs: the page frame
         (header + footer) and, separately, the home page's content. -->
    <div id="root"><!--prerender--></div>
    <template id="prerendered-home"><!--prerender-home--></template>
    <script>
      // Show the pre-built home content only on the home page itself; other
      // pages get just the header/footer until the app renders them. (Template
      // content is inert, so its images aren't downloaded on other pages.)
      (function () {
        var main = document.querySelector('#root [data-prerendered]');
        if (!main) return;
        var path = location.pathname;
        if (path === '/' && !location.search) {
          main.appendChild(document.getElementById('prerendered-home').content);
          return;
        }
        document.querySelectorAll('#root .nav-link').forEach(function (link) {
          var href = link.getAttribute('href');
          var current = href === '/' ? path === '/' : path.indexOf(href) === 0;
          link.classList.toggle('active', current);
          if (current) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
